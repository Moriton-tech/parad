<!doctype html>
<html lang="mn">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media=\'all\'"><noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet"></noscript>

<style>
  body { background: #eef0f7; }
  .login { max-width: 400px; margin: 60px auto; }
  .login .panel { padding: 26px; }
  .topbar { display: flex; align-items: center; gap: 10px; color: var(--navy); font-size: 13px; }
  .topbar .who { opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .role { background: var(--accent); color: #fff; font-weight: 800; font-size: 11px; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; background: #fff; border-radius: 14px; padding: 6px; margin: 18px 0; box-shadow: var(--shadow); scrollbar-width: none; }
  .tabs button { border: none; background: none; padding: 10px 14px; border-radius: 10px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; font-size: 14px; }
  .tabs button.active { background: var(--navy); color: #fff; }
  .tabs .dot { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; margin-left: 5px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: #fff; border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  .kpi span { color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .kpi b { display: block; font-family: var(--display); font-size: 32px; color: var(--navy); line-height: 1.1; margin-top: 2px; }
  .kpi small { color: var(--muted); font-size: 12px; }
  .kpi.warn { background: var(--red-l); } .kpi.warn b { color: var(--red); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .filters .input { width: auto; min-width: 140px; padding: 9px 12px; font-size: 14px; }
  .filters .grow { flex: 1; min-width: 200px; }
  .table-wrap { background: #fff; border-radius: 14px; box-shadow: var(--shadow); overflow-x: auto; margin-bottom: 16px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 860px; }
  table.tbl th, table.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.tbl th { background: #f5f6fb; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; position: sticky; top: 0; }
  table.tbl tr:hover td { background: #f7f8fd; }
  table.tbl td small { color: var(--muted); display: block; }
  .tag { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .tag.pending { background: var(--amber-l); color: #7a5b12; } .tag.confirmed, .tag.done, .tag.contacted { background: var(--ok-l); color: var(--ok); }
  .tag.cancelled, .tag.expired { background: var(--red-l); color: var(--red); } .tag.new { background: #dfeaf5; color: #1d4f7a; } .tag.closed { background: #e9ebf3; color: var(--muted); }
  .acts { display: flex; gap: 5px; flex-wrap: wrap; }
  .panel2 { background: #fff; border-radius: 14px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
  .panel2 h3 { margin: 0 0 10px; color: var(--navy); font-size: 17px; }
  .capgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .cap { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; cursor: pointer; border: 2px solid transparent; }
  .cap.sel { border-color: var(--accent); }
  .cap b { display: block; font-size: 14px; } .cap small { color: var(--muted); }
  .modal.wide { width: min(760px, 100%); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .photo-edit { display: flex; gap: 10px; flex-wrap: wrap; }
  .photo-edit .pe { position: relative; width: 96px; height: 96px; border-radius: 10px; overflow: hidden; border: 2px solid var(--line); }
  .photo-edit img { width: 100%; height: 100%; object-fit: cover; }
  .photo-edit .pe button { position: absolute; top: 2px; right: 2px; border: none; background: rgba(0,0,0,.65); color: #fff; width: 22px; height: 22px; border-radius: 11px; cursor: pointer; line-height: 1; }
  .photo-edit .pe .first { position: absolute; left: 2px; bottom: 2px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 5px; }
  .sect { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; }
  .sect h4 { margin: 0 0 8px; color: var(--navy); font-size: 15px; }
  .chk { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .chk input { width: 18px; height: 18px; }
  @media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
#hf .grid2 > *, #hf .grid3 > * { min-width: 0; }
#chk-box span { white-space: normal !important; display: inline-block; }
</style>

<body>
<header class="site-header"><div class="container">
  <a class="brand" href="index.html"><img src="img/parad-wordmark.png" alt="Parad.mn"><small>Админ</small></a>
  <a class="btn btn-ghost btn-sm" href="admin.html" style="margin-left:auto;margin-right:10px">Тасалбар · Сугалаа</a>
  <div class="topbar hidden" id="topbar"><span class="role" id="role"></span><span class="who" id="who"></span><button class="btn btn-ghost btn-sm" id="logout">Гарах</button></div>
</div></header>

<main class="container">
  <section class="login hidden" id="login"><div class="panel"><img src="img/parad-logo.png" alt="Parad.mn" style="width:240px;max-width:100%;margin:0 auto 12px">
    <h2 style="text-align:center;color:var(--navy);font-size:20px">Админ нэвтрэх</h2>
    <form class="form" id="login-form">
      <div><label for="l-email">Имэйл</label><input class="input" id="l-email" type="email" autocomplete="username" required></div>
      <div><label for="l-pass">Нууц үг</label><input class="input" id="l-pass" type="password" autocomplete="current-password" required></div>
      <div id="l-err"></div><button class="btn btn-navy btn-block" type="submit">Нэвтрэх</button>
    </form></div></section>

  <section class="hidden" id="app">
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
  </section>
</main>

<div class="modal-bg" id="modal" aria-hidden="true"><div class="modal" id="modal-box">
  <div class="modal-head"><b id="m-title"></b><button type="button" id="m-close" aria-label="Хаах">×</button></div>
  <div class="modal-body" id="m-body"></div></div></div>

<script type="module">
import { api as rawApi, auth, esc, money, mnt, fmtDT, toast, KIND, photoOf, configured, discPct, BREEDS, moneyVal } from './js/app.js?v=2611271330';
const $ = id => document.getElementById(id);
let me = null, H = [], site = null, tab = 'dash';
let B = [], Q = [], stats = null, bookingHorse = '', bookingStatus = '', bookingText = '';

async function api(action, body = {}) {
  const tok = await auth.token();
  if (!tok) { showLogin(); throw new Error('Дахин нэвтэрнэ үү.'); }
  try { return await rawApi(action, body, tok); }
  catch (e) { if (e.status === 401) { auth.logout(); showLogin(); } throw e; }
}
const fail = e => toast(e.message || String(e), 4500);
const AIMAGS = ['Улаанбаатар', 'Архангай', 'Баян-Өлгий', 'Баянхонгор', 'Булган', 'Говь-Алтай', 'Говьсүмбэр', 'Дархан-Уул', 'Дорноговь', 'Дорнод', 'Дундговь', 'Завхан', 'Орхон', 'Өвөрхангай', 'Өмнөговь', 'Сүхбаатар', 'Сэлэнгэ', 'Төв', 'Увс', 'Ховд', 'Хөвсгөл', 'Хэнтий', 'Гадаад'];
const ACH = ['Сумын ой', 'Аймгийн наадам', 'Аймгийн бүс', 'Улсын наадам', 'Улсын бүс', 'Их хурд'];
const TESTS = [['test_yam', 'Ям'], ['test_niiluuleg', 'Нийлүүлэг'], ['test_hachig', 'Хачгийн халуун']];
const TV = { pending: 'Хүлээгдэж буй', negative: 'Сөрөг ✓', positive: 'Эерэг ✗' };
const MSUH = { pending: 'Хүлээгдэж буй', approved: 'Баталсан ✓', rejected: 'Татгалзсан ✗' };
// Парадын шалгалтын чеклист: МСУХ, 3 шинжилгээ, хураамж, (азарга бол пасспорт + 5 зураг), лот
function checklist(h) {
  const items = [
    ['МСУХ удам баталсан', h.msuh_status === 'approved'],
    ...TESTS.map(([k, l]) => [`${l} сөрөг`, h[k] === 'negative']),
    ['Бүртгэлийн хураамж төлсөн', !!h.reg_fee_paid],
  ];
  if (h.kind === 'stallion') items.push(['Пасспорттой', !!h.has_passport], ['5+ зураг', (h.photos || []).length >= 5]);
  items.push(['Лотын дугаартай', h.lot_no != null]);
  return items;
}
const checkDone = h => checklist(h).every(([, ok]) => ok);
const pct = () => Number(site?.commission_pct ?? 10);
const commission = price => Math.round(Number(price || 0) * pct() / 100);

// ---------- цаг (Улаанбаатар UTC+8) ----------
const toLocalInput = v => v ? new Date(new Date(v).getTime() + 8 * 3600_000).toISOString().slice(0, 16) : '';
const fromLocalInput = v => v ? new Date(v + ':00+08:00').toISOString() : null;

// ---------- нэвтрэх ----------
function showLogin(msg) {
  $('app').classList.add('hidden'); $('topbar').classList.add('hidden'); $('login').classList.remove('hidden');
  if (msg) $('l-err').innerHTML = `<div class="alert error">${esc(msg)}</div>`;
}
$('login-form').onsubmit = async e => {
  e.preventDefault(); $('l-err').innerHTML = '';
  try { await auth.login($('l-email').value.trim(), $('l-pass').value); await boot(); }
  catch (ex) { $('l-err').innerHTML = `<div class="alert error">${esc(ex.message)}</div>`; }
};
$('logout').onclick = () => { auth.logout(); location.reload(); };

// ---------- модаль ----------
function modal(title, html, wide) {
  $('m-title').textContent = title; $('m-body').innerHTML = html;
  $('modal-box').classList.toggle('wide', !!wide);
  $('modal').classList.add('open'); $('modal').setAttribute('aria-hidden', 'false');
}
const closeModal = () => { $('modal').classList.remove('open'); $('modal').setAttribute('aria-hidden', 'true'); };
$('m-close').onclick = closeModal;
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

// ---------- табууд ----------
const TABS = [['dash', 'Самбар'], ['horses', 'Адуу'], ['stud', 'Гүү тавих'], ['sale', 'Зарах'], ['settings', 'Тохиргоо']];
function buildTabs() {
  const dots = { stud: stats?.stud_pending, sale: (stats?.sale_new || 0) };
  $('tabs').innerHTML = TABS.map(([k, l]) => `<button data-t="${k}" class="${tab === k ? 'active' : ''}">${l}${dots[k] ? `<span class="dot">${dots[k]}</span>` : ''}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.t; show(); });
}
async function show() {
  buildTabs();
  $('view').innerHTML = '<div class="empty-box">Ачаалж байна…</div>';
  try { await ({ dash: vDash, horses: vHorses, stud: vStud, sale: vSale, settings: vSettings })[tab](); } catch (e) { $('view').innerHTML = `<div class="alert error">${esc(e.message)}</div>`; }
}
async function loadHorses() { const r = await api('admin_horses'); H = r.horses; site = r.site; }
async function loadStats() { stats = await api('admin_pm_stats'); buildTabs(); }

// ================== САМБАР ==================
async function vDash() {
  await Promise.all([loadHorses(), loadStats()]);
  const s = stats;
  $('view').innerHTML = `<div class="kpis">
    <div class="kpi"><span>Бүртгэлтэй адуу</span><b>${s.horses}</b><small>${s.stallions} азарга</small></div>
    <div class="kpi ${s.stud_pending ? 'warn' : ''}"><span>Баталгаажуулалт хүлээж буй</span><b>${s.stud_pending}</b><small>гүү тавих захиалга</small></div>
    <div class="kpi"><span>Баталгаажсан захиалга</span><b>${s.stud_confirmed}</b><small>${s.stud_mares} гүү</small></div>
    <div class="kpi"><span>Баталгаажсан дүн</span><b style="font-size:24px">${money(s.stud_amount)}</b><small>төлөгдсөн ${money(s.stud_paid)}</small></div>
    <div class="kpi ${s.sale_new ? 'warn' : ''}"><span>Шинэ хүсэлт (зарах)</span><b>${s.sale_new}</b></div>
    <div class="kpi"><span>Явагдаж буй дуудлага</span><b>${s.auctions_open}</b><small>${s.bids} бооцоо</small></div>
    <div class="kpi"><span>Лоттой адуу</span><b>${s.lots ?? 0}</b><small>шалгалт бүрэн ${s.verified ?? 0}</small></div>
    <div class="kpi"><span>Зарагдсан</span><b>${s.sold_count ?? 0}</b><small>${money(s.sold_amount)} · шимтгэл ${money(s.commission)}</small></div>
    <div class="kpi"><span>Гүү тавих — манай орлого</span><b style="font-size:24px">${money(s.stud_org_fee)}</b><small>гүү тус бүрээс</small></div>
    <div class="kpi"><span>Бүртгэлийн хураамж</span><b style="font-size:24px">${money(s.reg_fees)}</b><small>төлсөн гэж тэмдэглэсэн</small></div></div>
    <div class="panel2"><h3>Азарга бүрийн суудал</h3>${capTable()}</div>`;
}
function capTable() {
  const rows = H.filter(h => h.stud_enabled).map(h => `<tr><td><b>${esc(h.name)}</b></td><td>${h.stud_active ? '' : '<span class="tag closed">Хаалттай</span>'}</td><td>${h.confirmed_mares}/${h.stud_capacity}</td><td>${h.pending_mares}</td><td>${h.stud_fee == null ? 'Private' : money(h.stud_price)}${h.stud_price < h.stud_fee ? ` <span class="disc-tag">-${discPct(h.stud_fee, h.stud_price)}%</span>` : ''}</td></tr>`).join('');
  return `<div class="table-wrap" style="box-shadow:none;margin:0"><table class="tbl" style="min-width:520px"><tr><th>Азарга</th><th></th><th>Баталгаажсан / суудал</th><th>Хүлээгдэж буй</th><th>Үнэ</th></tr>${rows || '<tr><td colspan="5" class="muted">Гүү тавих азарга алга</td></tr>'}</table></div>`;
}

// ================== АДУУ ==================
// Дуудлагад цаг тохируулахгүй: дуусах цагийг алс ирээдүйд тавьж, админ «хаагдсан» болгох хүртэл нээлттэй байлгана
const NO_END = '2099-12-31T15:59:00Z';

// Өмнө нь оруулсан зургуудыг шахах: жижиг (t) хувилбаргүй зураг бүрийг татаж, үндсэн + жижиг болгон дахин хадгална
async function shrinkAll() {
  const todo = H.filter(h => (h.photos || []).some(p => !p.t || p.t === p.u));
  if (!todo.length) return toast('Бүх зураг аль хэдийн шахагдсан байна.');
  if (!confirm(`${todo.length} адууны зургийг шахах уу? Хэдэн минут болж магадгүй — хуудсаа хаалгүй хүлээнэ үү.`)) return;
  const btn = $('shrink-all'); btn.disabled = true; let done = 0, bad = 0;
  for (const h of todo) {
    btn.textContent = `Шахаж байна… ${done + 1}/${todo.length}`;
    const photos = [];
    for (const p of h.photos || []) {
      if (p.t && p.t !== p.u) { photos.push(p); continue; }
      try {
        const img = await loadImg(p.u + (p.u.includes('?') ? '&' : '?') + 'x=' + Date.now());
        const up = async preset => (await api('admin_horse_photo', { slug: h.slug, data: await toB64(await shrink(img, preset)), type: 'image/jpeg' })).url;
        const [u, t] = await Promise.all([up(IMG.main), up(IMG.thumb)]);
        photos.push({ u, t });
      } catch (e) { bad++; photos.push(p); console.error(h.slug, e); }
    }
    try { await api('admin_horse_save', { horse: { id: h.id, photos } }); h.photos = photos; } catch (e) { bad++; console.error(e); }
    done++;
  }
  btn.disabled = false; btn.textContent = 'Зургуудыг шахах';
  toast(bad ? `${done} адуу дууслаа, ${bad} зураг алдаатай (дахин дарж оролдоно уу).` : `${done} адууны зураг шахагдлаа ✓`);
  await loadHorses(); vHorses();
}

// Адууны жагсаалт: каталогийн №, оруулсан дараалал, нэрээр эрэмбэлэх + хайх, шүүх (сонголт энэ хөтөч дээр хадгалагдана)
const HV = (() => { try { return { sort: 'cat', q: '', kind: 'all', pub: 'all', ...JSON.parse(localStorage.getItem('pm_hv') || '{}') }; } catch { return { sort: 'cat', q: '', kind: 'all', pub: 'all' }; } })();
const saveHV = () => { try { localStorage.setItem('pm_hv', JSON.stringify({ ...HV, q: '' })); } catch { /* */ } };
const SORTS = {
  cat: ['Каталог № (1→)', (a, b) => (a.sort ?? 1e9) - (b.sort ?? 1e9) || a.name.localeCompare(b.name)],
  catd: ['Каталог № (→1)', (a, b) => (b.sort ?? -1) - (a.sort ?? -1) || a.name.localeCompare(b.name)],
  added: ['Оруулсан дараалал (эхнийх нь эхэнд)', (a, b) => String(a.created_at || '').localeCompare(String(b.created_at || ''))],
  addedd: ['Сүүлд оруулсан нь эхэнд', (a, b) => String(b.created_at || '').localeCompare(String(a.created_at || ''))],
  edited: ['Сүүлд зассан нь эхэнд', (a, b) => String(b.updated_at || '').localeCompare(String(a.updated_at || ''))],
  name: ['Нэрээр (А→Я)', (a, b) => a.name.localeCompare(b.name, 'mn')],
};
async function vHorses() {
  await loadHorses();
  const hasDates = H.some(h => h.created_at);
  if (!hasDates && ['added', 'addedd', 'edited'].includes(HV.sort)) HV.sort = 'cat';
  const kinds = [...new Set(H.map(h => h.kind))];
  $('view').innerHTML = `<div class="filters"><button class="btn btn-accent" id="new-horse">+ Шинэ адуу бүртгэх</button><button class="btn btn-light" id="shrink-all" title="Хуучин том зургуудыг жижигрүүлж, картанд зориулсан жижиг хувилбар үүсгэнэ">Зургуудыг шахах</button></div>
    <div class="filters hv-bar">
      <input class="input" id="hv-q" type="search" placeholder="Хайх: каталог №, нэр, эцэг, эх, тамга…" value="${esc(HV.q)}" style="flex:1 1 240px">
      <select class="input" id="hv-sort">${Object.entries(SORTS).filter(([k]) => hasDates || !['added', 'addedd', 'edited'].includes(k)).map(([k, [l]]) => `<option value="${k}"${HV.sort === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
      <select class="input" id="hv-kind"><option value="all">Бүх төрөл</option>${kinds.map(k => `<option value="${k}"${HV.kind === k ? ' selected' : ''}>${esc(KIND[k] || k)}</option>`).join('')}</select>
      <select class="input" id="hv-pub">${[['all', 'Бүгд'], ['pub', 'Сайтад харагддаг'], ['hid', 'Нууцалсан'], ['nophoto', 'Зураггүй']].map(([k, l]) => `<option value="${k}"${HV.pub === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
      <span class="muted small" id="hv-n"></span></div>
    <div class="table-wrap"><table class="tbl"><thead><tr><th style="width:56px">№</th><th></th><th>Адуу</th><th>Гүү тавих</th><th>Зарах</th><th>Төлөв</th><th></th></tr></thead><tbody id="hv-rows"></tbody></table></div>
    ${hasDates ? '' : '<p class="small muted">«Оруулсан дараалал»-аар эрэмбэлэх нь серверийн шинэчлэлийн дараа нэмэгдэнэ.</p>'}`;
  const paint = () => {
    const t = HV.q.trim().toLowerCase();
    const list = H.filter(h => (HV.kind === 'all' || h.kind === HV.kind)
      && (HV.pub === 'all' || (HV.pub === 'pub' && h.published) || (HV.pub === 'hid' && !h.published) || (HV.pub === 'nophoto' && !(h.photos || []).length))

    <td>${h.stud_enabled ? `Гүү бүртгэнэ · ${h.stud_fee == null ? 'Private' : money(h.stud_price) + (h.stud_price < h.stud_fee ? ` <span class="disc-tag">-${discPct(h.stud_fee, h.stud_price)}%</span>` : '')}<small>${h.confirmed_mares}/${h.stud_capacity}${h.stud_active ? '' : ' · хаалттай'}</small>` : '<span class="muted">—</span>'}</td>

      || `<tr><td colspan="7" class="muted">${H.length ? 'Хайлтад тохирох адуу алга' : 'Адуу бүртгэгдээгүй байна'}</td></tr>`;
    $('hv-rows').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editHorse(H.find(h => h.id === b.dataset.edit)));
  };
  $('hv-q').oninput = e => { HV.q = e.target.value; paint(); };
  $('hv-sort').onchange = e => { HV.sort = e.target.value; saveHV(); paint(); };
  $('hv-kind').onchange = e => { HV.kind = e.target.value; saveHV(); paint(); };
  $('hv-pub').onchange = e => { HV.pub = e.target.value; saveHV(); paint(); };
  $('new-horse').onclick = () => editHorse(null);
  $('shrink-all').onclick = shrinkAll;
  paint();
}

// Зургийг хөтөч дээр жижигрүүлж JPEG болгоно (сайт хурдан ачаалагдахын тулд):
//   үндсэн зураг — урт тал 1100px, чанар 0.72 (~100–150KB)
//   жижиг (карт)  — урт тал 480px,  чанар 0.68 (~25–40KB)
//   удмын бичиг   — урт тал 1600px, чанар 0.8 (бичиг уншигдахаар)
const IMG = { main: [1100, .72], thumb: [480, .68], pedigree: [1600, .8] };
function loadImg(src) {
  return new Promise((res, rej) => { const img = new Image(); img.crossOrigin = 'anonymous'; img.onload = () => res(img); img.onerror = () => rej(new Error('Зураг уншиж чадсангүй')); img.src = src; });
}
function shrink(img, [max, q]) {
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Зураг боловсруулж чадсангүй')), 'image/jpeg', q));
}
async function resizeImage(file, preset = IMG.main) {
  const url = URL.createObjectURL(file);
  try { return await shrink(await loadImg(url), preset); } finally { URL.revokeObjectURL(url); }
}
const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });

async function studAction(a, code) {
  const b = B.find(x => x.code === code);

    else if (a === 'done') { await api('admin_stud_update', { code, status: 'done' }); toast('Хийгдсэн гэж тэмдэглэлээ'); }
    else if (a === 'paid') { await api('admin_stud_update', { code, paid: !b.paid }); }

function csv(list) {

  const rows = list.map(b => [b.code, b.horses?.name, b.owner_name, b.phone, b.location, b.mares, b.queue_from, SM[dispStatus(b)], b.unit_price, b.amount, b.paid ? 'тийм' : '', b.mare_info, b.admin_note, fmtDT(b.created_at)]);
  const blob = new Blob(['﻿' + [head, ...rows].map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });

      <div><label>Зарагчид шилжүүлэх (ажлын өдөр)</label><input class="input" name="payout_days" type="number" min="0" value="${s.payout_days ?? 3}"></div></div>
    <div id="ps-err"></div><button class="btn btn-accent" type="submit" style="align-self:start">Хадгалах</button></form>
    <div class="panel2"><h3>Эзний хязгаар</h3><p class="small muted" style="margin:0 0 10px">Анхдагчаар нэг эзэнд ${s.seller_max_horses ?? 2} зарах адуу. Онцгой тохиолдолд энд эзний утсаар хязгаарыг нэмнэ.</p>
      <div id="ol-list" class="small"></div>
      <form class="filters" id="ol-form" style="margin-top:10px"><input class="input" name="phone" type="tel" placeholder="Эзний утас" required><input class="input" name="max" type="number" min="1" max="100" placeholder="Хязгаар" style="width:110px"><input class="input grow" name="note" placeholder="Тайлбар"><button class="btn btn-navy" type="submit">Хадгалах</button></form></div>
    <div class="panel2"><h3>Парад, тасалбар</h3><p class="small muted" style="margin:0 0 10px">Парадын огноо, байршил, тасалбарын үнэ, QPay, ажилтны эрхийг «Тасалбар · Сугалаа» админ хуудасны <b>Тохиргоо</b> таб дээр засна. Огноог оруулаад «парад зарлагдсан» болгох хүртэл нүүр хуудсанд «удахгүй» гэж харагдана.</p><a class="btn btn-light" href="admin.html">Тасалбарын админ →</a></div>`;
  $('pf2').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    const settings = {}; for (const el of f.elements) if (el.name) settings[el.name] = el.type === 'number' ? Number(el.value) : el.hasAttribute('data-money') ? moneyVal(el.value) : el.value;
    try { await api('admin_pm_settings_save', { settings }); toast('Хадгалагдлаа'); } catch (ex) { $('ps-err').innerHTML = `<div class="alert error">${esc(ex.message)}</div>`; }
  };
  const paintOL = async () => {
    try {
      const { limits } = await api('admin_owner_limits');
      $('ol-list').innerHTML = limits.length ? `<table class="tbl" style="min-width:420px"><tr><th>Утас</th><th>Хязгаар</th><th>Тайлбар</th><th></th></tr>${limits.map(l => `<tr><td class="mono">${esc(l.phone8)}</td><td><b>${l.max_horses}</b></td><td>${esc(l.note || '')}<small>${esc(l.updated_by || '')}</small></td><td><button class="btn btn-light btn-sm" data-ol="${esc(l.phone8)}">Устгах</button></td></tr>`).join('')}</table>` : '<span class="muted">Онцгой хязгаар алга.</span>';
      $('ol-list').querySelectorAll('[data-ol]').forEach(b => b.onclick = async () => { try { await api('admin_owner_limit_set', { phone: b.dataset.ol, max: '' }); paintOL(); } catch (e) { fail(e); } });
    } catch (e) { $('ol-list').innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`; }
  };
  $('ol-form').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    try { await api('admin_owner_limit_set', { phone: f.phone.value, max: f.max.value, note: f.note.value }); f.reset(); toast('Хадгалагдлаа'); paintOL(); } catch (ex) { fail(ex); }
  };
  paintOL();
}

// ---------- эхлүүлэх ----------
async function boot() {
  if (!configured) { showLogin('Тохиргоо дутуу: js/config.js-д Supabase URL, түлхүүрээ оруулна уу.'); return; }
  const tok = await auth.token();
  if (!tok) { showLogin(); return; }
  try { me = await api('admin_me'); } catch (e) { auth.logout(); showLogin(e.message); return; }
  if (me.role !== 'admin') { auth.logout(); showLogin('Энэ хуудсанд админ эрх хэрэгтэй.'); return; }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('topbar').classList.remove('hidden');
  $('role').textContent = me.role; $('who').textContent = me.email;
  await loadStats().catch(() => {});
  show();
}
boot();
</script>
</body>
</html>
